input{width:100%;padding:8px 34px 8px 34px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);font:inherit}
button.chip{padding:6px 12px;border:1px solid var(--bd);border-radius:999px;background:var(--card);color:var(--fg);font:inherit;cursor:pointer}
button.chip.on{background:var(--fg);color:var(--bg)}
.map{flex:1;min-width:0;overflow:auto;display:flex;flex-direction:column;padding:var(--py,0px) calc(340px + var(--px,0px)) var(--py,0px) var(--px,0px);scrollbar-width:thin;scrollbar-color:var(--sb) transparent}

.map::-webkit-scrollbar-track,#det::-webkit-scrollbar-track,.map::-webkit-scrollbar-corner{background:transparent}
.map::-webkit-scrollbar-thumb,#det::-webkit-scrollbar-thumb{background:var(--sb);border-radius:999px;border:3px solid transparent;background-clip:content-box}
.map::-webkit-scrollbar-thumb:hover,#det::-webkit-scrollbar-thumb:hover{background:var(--mut);background-clip:content-box}
#s{flex:none;display:block;margin:auto;width:762px;max-width:none;height:auto}
#s{touch-action:pan-x pan-y}#s.panning{cursor:grabbing}
#zc{display:flex;align-items:center;gap:5px;opacity:.4;transition:opacity .15s}
#zc:hover,#zc:focus-within,#zc.act{opacity:1}
#zc button{border:1px solid var(--bd);background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.12);color:var(--fg);font:inherit;font-size:12px;line-height:1;cursor:pointer;height:18px;min-width:18px;padding:0 6px;border-radius:999px}
#zc button:hover{background:var(--bg)}
#zo,#zi{width:18px;padding:0!important}
#zc button:disabled{opacity:.35;cursor:default;background:var(--card)}
#zr{min-width:46px;font-size:12px;font-variant-numeric:tabular-nums}
.legal{flex:none;display:block;margin:0;padding:28px 0 12px 16px;font-size:12px;color:var(--mut)}
.n{cursor:grab;transition:opacity .15s;user-select:none;-webkit-user-select:none}
#s.dragging,#s.dragging .n{cursor:grabbing}
.n rect{fill:var(--card)}
.n text{fill:var(--fg);text-anchor:middle}
.n .t{font-weight:700;font-size:13px}
.n text{font-family:inherit}
.n .d{fill:var(--mut);font-size:9px}
.n.sel rect{fill:var(--bd)}
/* Fondo de nodos: tinte suave del módulo; más intenso al pasar el mouse o seleccionar */
.n rect{transition:fill .12s}
.n.c rect{fill:color-mix(in srgb,var(--c) 7%,var(--card))}.n.c:hover rect{fill:color-mix(in srgb,var(--c) 20%,var(--card))}.n.c.sel rect{fill:color-mix(in srgb,var(--c) 28%,var(--card))}
.e{fill:none;stroke:var(--bd);stroke-width:1.5}
.e.hi{stroke:var(--fg);stroke-width:2.5}
.e.x{stroke:var(--fg);stroke-width:2;stroke-dasharray:5 4}
#det{visibility:hidden;position:absolute;top:0;bottom:0;right:12px;width:340px;overflow:auto;background:var(--card);border-left:1px solid var(--bd);padding:16px 18px;scrollbar-width:thin;scrollbar-color:var(--sb) transparent}
#dx{position:absolute;top:6px;right:8px;border:0;background:none;color:var(--mut);font-size:22px;line-height:1;cursor:pointer}
#det.on{visibility:visible}
#nores{display:none;position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:4px 14px;font-size:13px;color:var(--mut);pointer-events:none}

a.l{color:inherit;font-weight:600;cursor:pointer;text-decoration:underline}
.mut{color:var(--mut)}

    if(n.cy>=top&&n.cy<=bot)seen[n.id]=1;else if(b<vt||t>vb)seen[n.id]=0;   /* solo acompaña si ya se vio en su lugar */
    let want=!seen[n.id]?n.cy:n.cy<top?top+Math.min(top-n.cy,pad):n.cy>bot?bot-Math.min(n.cy-bot,pad):n.cy;want=Math.max(t+h2,Math.min(b-h2,want));
    const d=want-n.cy;if(Math.abs((stk[n.id]||0)-d)>.5){stk[n.id]=d;moveLive(n.id)}})}
let stkQ=0;mapEl.addEventListener("scroll",()=>{if(!stkQ)stkQ=requestAnimationFrame(()=>{stkQ=0;updStick()})},{passive:true});
window.addEventListener("resize",()=>updStick());
let drag=null,wasDrag=false;
function moveLive(id){
  const n=by(id);if(!n)return;
  const o=off(n),g=svg.querySelector(`.n[data-id="${id}"]`);
  if(g){if(o[0]||o[1])g.setAttribute("transform",`translate(${o[0]},${o[1]})`);else g.removeAttribute("transform")}
  svg.querySelectorAll(`path[data-a="${id}"],path[data-b="${id}"]`).forEach(p=>{const a=by(p.dataset.a),b=by(p.dataset.b);if(a&&b)p.setAttribute("d",path(sh(a),sh(b)))})}
function spring(id){
  const o=OFF[id];if(!o)return;const a=[o[0],o[1]],t0=performance.now();
  const step=t=>{const p=Math.min(1,(t-t0)/180),k=1-Math.pow(1-p,3);
    if(p<1){OFF[id]=[a[0]*(1-k),a[1]*(1-k)];moveLive(id);requestAnimationFrame(step)}else{delete OFF[id];moveLive(id)}};
  requestAnimationFrame(step)}
/* ZOOM: Ctrl+rueda (o pellizco en pantallas táctiles); arrastrar el fondo para mover */
let Z=1;const zr=document.getElementById("zr");
function setZ(z,cx,cy){
  z=Math.max(.5,Math.min(3,z));if(Math.abs(z-Z)<.001)return;
  const r=svg.getBoundingClientRect(),ux=(cx-r.left)/r.width,uy=(cy-r.top)/r.height;
  Z=z;svg.style.width=(762*Z)+"px";
  /* margen extra para poder mover el diagrama más allá de los bordes cuando hay zoom */
  mapEl.style.setProperty("--px",Z>1.01?"160px":"0px");mapEl.style.setProperty("--py",Z>1.01?"120px":"0px");
  const q=svg.getBoundingClientRect();
  mapEl.scrollLeft+=q.left+ux*q.width-cx;mapEl.scrollTop+=q.top+uy*q.height-cy;
  updStick();zr.textContent=Math.round(Z*100)+"%";
  document.getElementById("zc").classList.toggle("act",Math.abs(Z-1)>=.01);
  document.getElementById("zo").disabled=Z<=.5+.001;document.getElementById("zi").disabled=Z>=3-.001}
const zctr=()=>{const r=mapEl.getBoundingClientRect();return[r.left+(r.width-340)/2,r.top+r.height/2]};
document.getElementById("zi").onclick=()=>setZ(Z*1.25,...zctr());
document.getElementById("zo").onclick=()=>setZ(Z/1.25,...zctr());
zr.onclick=()=>{const r=mapEl.getBoundingClientRect();setZ(1,r.left+r.width/2,r.top+r.height/2)};
mapEl.addEventListener("wheel",e=>{if(!e.ctrlKey&&!e.metaKey)return;e.preventDefault();setZ(Z*Math.exp(-e.deltaY*(e.deltaMode?.05:.0015)),e.clientX,e.clientY)},{passive:false});
const ptrs=new Map();let pinch=null,pan=null;
svg.addEventListener("pointerdown",e=>{
  if(e.pointerType==="touch"){ptrs.set(e.pointerId,[e.clientX,e.clientY]);if(ptrs.size===2){const[a,b]=[...ptrs.values()];pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]),z:Z};drag=null;wasDrag=true}}
  
},true);
mapEl.addEventListener("pointerdown",e=>{
  if(e.pointerType==="touch"||e.button!==0||e.target.closest(".n,.legal,#zc"))return;
  if(e.target===mapEl&&(e.offsetX>mapEl.clientWidth||e.offsetY>mapEl.clientHeight))return; /* barra de scroll */
  pan={x:e.clientX,y:e.clientY,l:mapEl.scrollLeft,t:mapEl.scrollTop,moved:false}},true);
svg.addEventListener("pointermove",e=>{
  if(ptrs.has(e.pointerId)){ptrs.set(e.pointerId,[e.clientX,e.clientY]);if(pinch&&ptrs.size===2){const[a,b]=[...ptrs.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);setZ(pinch.z*d/pinch.d,(a[0]+b[0])/2,(a[1]+b[1])/2)}}
});
window.addEventListener("pointermove",e=>{
  if(!pan)return;const dx=e.clientX-pan.x,dy=e.clientY-pan.y;
  if(!pan.moved){if(Math.hypot(dx,dy)<5)return;pan.moved=true;wasDrag=true;svg.classList.add("panning")}
  /* eje con desplazamiento: scroll; eje sin desplazamiento: se mueve con margen y vuelve solo */
  const ox=mapEl.scrollWidth>mapEl.clientWidth+1,oy=mapEl.scrollHeight>mapEl.clientHeight+1,M=60,el=v=>M*Math.tanh(v/M);
  if(ox)mapEl.scrollLeft=pan.l-dx;if(oy)mapEl.scrollTop=pan.t-dy;
  if(!ox||!oy){svg.style.transition="none";svg.style.transform=`translate(${ox?0:el(dx)}px,${oy?0:el(dy)}px)`}});
const endPan=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;if(pan){if(pan.moved&&svg.style.transform){svg.style.transition="transform .3s cubic-bezier(.2,.8,.2,1)";svg.style.transform=""}pan=null;svg.classList.remove("panning")}};
window.addEventListener("pointerup",endPan);window.addEventListener("pointercancel",endPan);
svg.addEventListener("pointerdown",e=>{
  wasDrag=!!pinch;if(e.button!==0)return;
  const g=e.target.closest(".n");if(!g||!by(g.dataset.id))return;
  const o=OFF[g.dataset.id]||[0,0],r=svg.getBoundingClientRect();
  drag={id:g.dataset.id,x0:e.clientX,y0:e.clientY,o0:[o[0],o[1]],k:svg.viewBox.baseVal.width/r.width,moved:false,pid:e.pointerId}});
window.addEventListener("pointermove",e=>{
  if(!drag||e.pointerId!==drag.pid)return;
  const dx=e.clientX-drag.x0,dy=e.clientY-drag.y0;
  if(!drag.moved){if(Math.hypot(dx,dy)<5)return;drag.moved=true;wasDrag=true;svg.classList.add("dragging")}
  OFF[drag.id]=clampOff(by(drag.id),drag.o0[0]+dx*drag.k,drag.o0[1]+dy*drag.k);
  moveLive(drag.id)});
const endDrag=e=>{
  if(!drag||(e&&e.pointerId!==undefined&&e.pointerId!==drag.pid))return;
  const d=drag;drag=null;svg.classList.remove("dragging");
  if(d.moved&&ELASTIC)spring(d.id)};
window.addEventListener("pointerup",endDrag);
window.addEventListener("pointercancel",endDrag);
window.addEventListener("blur",()=>endDrag());
let lastClk={id:null,t:0};
mapEl.onclick=e=>{if(wasDrag)return;const g=e.target.closest(".n"),id=g&&g.dataset.id,now=performance.now();
  if(id&&OFF[id]&&lastClk.id===id&&now-lastClk.t<400){delete OFF[id];lastClk={id:null,t:0};sel=null;draw();return}
  lastClk={id,t:now};
  sel=g&&id!==sel?id:null;draw()};
document.getElementById("det").onclick=e=>{const a=e.target.closest("[data-go]"),x=e.target.closest("[data-tx]"),tb=e.target.closest("[data-tab]");
 if(tb){setView("tab");ensure(tb.dataset.tab);sel=tb.dataset.tab;draw()}
 else if(a){ensure(a.dataset.go);sel=a.dataset.go;draw()}
 else if(x){if(view==="tx"){ensure(x.dataset.tx);sel=x.dataset.tx;draw()}else{q=x.dataset.tx;document.getElementById("q").value=q;sel=null;build();draw()}}};
document.getElementById("dx").onclick=()=>{sel=null;draw()};
document.onkeydown=e=>{if(e.key==="Escape"){sel=null;draw()}};
document.getElementById("q").oninput=e=>{q=e.target.value;build();document.querySelector(".map").scrollTop=0;draw()};
document.getElementById("qx").onclick=()=>{q="";const i=document.getElementById("q");i.value="";build();document.querySelector(".map").scrollTop=0;draw();i.focus()};
document.querySelectorAll(".chip[data-v]").forEach(b=>b.onclick=()=>{setView(b.dataset.v);draw()});
document.querySelectorAll(".chip[data-s]").forEach(b=>b.onclick=()=>{setSys(b.dataset.s);draw()});

draw();
</script>
