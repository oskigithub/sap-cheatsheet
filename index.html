.srch{position:relative;flex:1 1 200px;display:block}

input{width:100%;padding:8px 34px 8px 34px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);font:inherit}
button.chip{padding:6px 12px;border:1px solid var(--bd);border-radius:999px;background:var(--card);color:var(--fg);font:inherit;cursor:pointer}
button.chip.on{background:var(--fg);color:var(--bg)}
.map{flex:1;min-width:0;overflow:auto;padding-right:340px;scrollbar-width:thin;scrollbar-color:var(--sb) transparent}
.map::-webkit-scrollbar,#det::-webkit-scrollbar{width:10px;height:10px}
.map::-webkit-scrollbar-track,#det::-webkit-scrollbar-track,.map::-webkit-scrollbar-corner{background:transparent}
.map::-webkit-scrollbar-thumb,#det::-webkit-scrollbar-thumb{background:var(--sb);border-radius:999px;border:3px solid transparent;background-clip:content-box}
.map::-webkit-scrollbar-thumb:hover,#det::-webkit-scrollbar-thumb:hover{background:var(--mut);background-clip:content-box}
#s{display:block;margin:0 48px 0 auto;width:762px;max-width:none;height:auto}
.n{cursor:pointer;transition:opacity .15s}
.n rect{fill:var(--card)}
.n text{fill:var(--fg);text-anchor:middle}
.n .t{font-weight:700;font-size:13px}
.n .d{fill:var(--mut);font-size:9px}
.n.sel rect{fill:var(--bd)}
.e{fill:none;stroke:var(--bd);stroke-width:1.5}
.e.hi{stroke:var(--fg);stroke-width:2.5}
.e.x{stroke:var(--fg);stroke-width:2;stroke-dasharray:5 4}
#det{visibility:hidden;position:absolute;top:0;bottom:0;right:12px;width:340px;overflow:auto;background:var(--card);border-left:1px solid var(--bd);padding:16px 18px;scrollbar-width:thin;scrollbar-color:var(--sb) transparent}
#dx{position:absolute;top:6px;right:8px;border:0;background:none;color:var(--mut);font-size:22px;line-height:1;cursor:pointer}
#det.on{visibility:visible}
#nores{display:none;position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:4px 14px;font-size:13px;color:var(--mut);pointer-events:none}
@media (max-width:760px){.frame{flex-direction:column}.map{padding-right:0}#det{display:none;position:relative;top:auto;bottom:auto;right:auto;width:auto;max-height:45%;border-left:0;border-top:1px solid var(--bd)}#det.on{display:block}}

a.l{color:inherit;font-weight:600;cursor:pointer;text-decoration:underline}
.mut{color:var(--mut)}
</style>

  const mk=()=>{kids={};N.forEach(n=>{if(n.p)(kids[n.p]=kids[n.p]||[]).push(n)})};mk();
  hitSet=new Set();
  const ql=q.trim().toLowerCase();
  if(ql){
    const txt=n=>(n.mod?n.id+" "+(n.lab||"")+" "+n.name+" "+n.d:n.proc?n.t+" "+n.id:n.tx?n.id+" "+n.d+" "+n.k.join(" ")+" "+((TX.find(t=>t.c===n.id)||{}).n||""):n.id+" "+(n.d0||n.d)+" "+n.k.join(" ")+" "+(NOTES[n.id]||"")+" "+txOf(n.id).map(t=>t.c+" "+t.d+" "+(t.n||"")).join(" ")).toLowerCase();
    const down=n=>{(kids[n.id]||[]).forEach(k=>{hitSet.add(k.id);down(k)})};
    N.forEach(n=>{if(txt(n).includes(ql)){hitSet.add(n.id);down(n);let a=n.p?by(n.p):null;while(a){hitSet.add(a.id);a=a.p?by(a.p):null}}});
    Object.values(kids).forEach(l=>l.sort((a,b)=>(hitSet.has(a.id)?0:1)-(hitSet.has(b.id)?0:1)));
  }
  cur=34;
  const lay=(n,d)=>{const c=kids[n.id]||[];n.x=X[d];
    if(!c.length){n.cy=cur;cur+=ROW}else{c.forEach(k=>lay(k,d+1));n.cy=(c[0].cy+c[c.length-1].cy)/2}};
  [...MODS].sort((a,b)=>(hitSet.has(a.id)?0:1)-(hitSet.has(b.id)?0:1)).forEach(m=>{const mn=by(m.id);if(mn){lay(mn,0);cur+=18}});
  svg.setAttribute("viewBox",`0 0 762 ${Math.max(cur,120)}`)}
function setView(v){if(v===view)return;view=v;sel=null;build();document.querySelectorAll(".chip[data-v]").forEach(c=>c.classList.toggle("on",c.dataset.v===v))}
function setSys(s){if(s===sys)return;sys=s;sel=null;applySys();build();document.querySelectorAll(".chip[data-s]").forEach(c=>c.classList.toggle("on",c.dataset.s===s))}
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function ensure(id){if(!by(id)){q="";document.getElementById("q").value="";build()}}
let sys="ecc",T=T0,E=E0,TX=TX0;
build();
const isTree=(a,b)=>by(a).p===b||by(b).p===a;
const col=m=>`var(--${m.toLowerCase()})`;
let sel=null,mod="ALL",proc="";
function path(a,b,same){
  if(a.x===b.x){const x=a.x,ya=a.cy,yb=b.cy;return `M${x},${ya} C${x-34},${ya} ${x-34},${yb} ${x},${yb}`}
  if(a.x>b.x)[a,b]=[b,a];
  const x1=a.x+a.w,x2=b.x,mid=(x1+x2)/2;
  return `M${x1},${a.cy} C${mid},${a.cy} ${mid},${b.cy} ${x2},${b.cy}`}
function adj(id){
  const n=by(id);
  if(n.mod)return N.filter(t=>t.m===id).map(t=>t.id);
  const r=E.filter(e=>e[0]===id||e[1]===id).map(e=>e[0]===id?e[1]:e[0]);
  if(n.p)r.push(n.p);const dsc=x=>(kids[x]||[]).forEach(k=>{r.push(k.id);dsc(k.id)});dsc(id);return r}
function draw(){
  const rel=sel?[sel,...adj(sel)]:null,soft0=q.trim().length>0;
  document.getElementById("qx").style.display=soft0?"flex":"none";
  let h="";
  N.filter(n=>n.p).forEach(n=>{const p=by(n.p),hi=sel&&(sel===n.id||sel===p.id||(by(sel).mod&&by(sel).id===n.m));
    h+=`<path class="e${hi?" hi":""}" d="${path(p,n)}"/>`});
  if(sel&&!by(sel).mod)E.filter(e=>(e[0]===sel||e[1]===sel)&&by(e[0])&&by(e[1])&&!isTree(e[0],e[1])).forEach(e=>{h+=`<path class="e x" d="${path(by(e[0]),by(e[1]))}"/>`});
  h+=N.map(n=>{
    const dim=rel?!rel.includes(n.id):(soft0&&!hitSet.has(n.id));
    const y=n.cy-n.h/2,cx=n.x+n.w/2;
    const txt=n.mod?`<svg x="${n.x-34}" y="${n.cy-13}" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="${col(n.m)}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IP[n.i]}</svg><text class="t" x="${cx}" y="${y+23}" style="font-size:17px;fill:${col(n.m)}">${n.lab||n.id}</text><text class="d" x="${cx}" y="${y+40}" style="font-size:10px">${n.d}</text>`
      :`<text class="t" x="${cx}" y="${y+16}">${n.t||n.id}</text><text class="d" x="${cx}" y="${y+30}">${n.d.length>27?n.d.slice(0,26)+"…":n.d}</text>`;
    return `<g class="n${n.id===sel?" sel":""}" data-id="${n.id}" opacity="${dim?.15:1}"><rect x="${n.x}" y="${y}" width="${n.w}" height="${n.h}" rx="${n.mod?12:8}" stroke="${col(n.m)}" stroke-width="${n.mod?3:2}"${n.r?' stroke-dasharray="5 3"':""}/>${txt}</g>`}).join("");
  const nr=document.getElementById("nores");
  if(soft0&&hitSet.size===0){nr.style.display="block";nr.textContent="Sin resultados para “"+q.trim()+"”"}else nr.style.display="none";
  svg.innerHTML=h;
  const pan=document.getElementById("det"),d=document.getElementById("dc");
  pan.classList.toggle("on",!!sel);if(!sel)return;
  const n=by(sel);
  if(n.proc){const L=TX.filter(t=>t.m===n.m&&t.p===n.pr),tb=[...new Set(L.flatMap(t=>t.t))];d.innerHTML=`<b style="color:${col(n.m)}">${n.m}</b> · <b>${n.t}</b> <span class="mut">· ${L.length} transacciones</span><div style="margin-top:8px"><span class="mut">Tablas del proceso:</span>${tabBlock(tb)}</div>`;return}
  if(n.tx){const t=TX.find(x=>x.c===n.id),j=joinsOf(t.t);d.innerHTML=`<b style="color:${col(n.m)}">${t.m}</b> · <b>${t.c}</b> – ${t.d} <span class="mut">· ${t.p}</span>${t.n?`<div style="margin-top:8px">${t.n}</div>`:""}<div style="margin-top:8px"><span class="mut">Tablas que usa:</span>${tabBlock(t.t)}</div>${j?`<div><span class="mut">Uniones entre ellas:</span><ul style="margin:4px 0 0;padding-left:20px">${j}</ul></div>`:""}`;return}
  if(n.mod&&view==="tx"){const tb=T.filter(r=>r[1]===n.id).map(r=>r[0]);d.innerHTML=`<b style="color:${col(n.m)}">${n.id}</b> · <b>${n.name}</b> <span class="mut">– ${n.d}</span><div class="mut" style="margin-top:6px">${TX.filter(t=>t.m===n.id).length} transacciones</div><div style="margin-top:8px"><span class="mut">Tablas del módulo:</span>${tabBlock(tb)}</div>`;return}
  if(n.mod){
    d.innerHTML=`<b style="color:${col(n.m)}">${n.id}</b> · <b>${n.name}</b> <span class="mut">– ${n.d}</span><div style="margin-top:8px"><span class="mut">Tablas:</span><br>${N.filter(t=>t.m===n.id&&!t.mod).map(t=>`<a class="l" data-go="${t.id}">${t.id}</a> <span class="mut">${t.d}</span>`).join("<br>")}</div><div style="margin-top:8px"><span class="mut">Transacciones:</span><br>${txl(TX.filter(t=>t.m===n.id))}</div>`;return}
  const rl=E.filter(e=>e[0]===sel||e[1]===sel).map(e=>{const o=e[0]===sel?e[1]:e[0];return `<li><a class="l" data-go="${o}">${o}</a> <span class="mut">vía ${e[2]}</span></li>`}).join("");
  d.innerHTML=`<a class="l" data-go="${n.m}" style="color:${col(n.m)}">${n.m}</a> · <b>${n.id}</b> – ${n.d0||n.d}${n.r?`<div class="mut" style="margin:8px 0;padding:8px 10px;border:1px dashed var(--bd);border-radius:8px">S/4HANA: ${n.r.n}</div>`:n.nw?`<div class="mut" style="margin:8px 0;padding:8px 10px;border:1px dashed var(--bd);border-radius:8px">${n.note}</div>`:""}${NOTES[n.id]?`<div style="margin:8px 0">${NOTES[n.id]}</div>`:""}<div style="margin:8px 0"><span class="mut">Campos clave:</span><br>${n.k.map(k=>`<span class="k">${k}</span>`).join("")}</div><span class="mut">Se une con:</span><ul style="margin:4px 0 0;padding-left:20px">${rl}</ul><div style="margin-top:8px"><span class="mut">Transacciones:</span><br>${txl(txOf(n.id),0)||'<span class="mut">–</span>'}<div class="mut" style="margin-top:4px">Ver datos crudos: SE16N · estructura: SE11</div></div>`;
}
document.querySelector(".map").onclick=e=>{const g=e.target.closest(".n");sel=g&&g.dataset.id!==sel?g.dataset.id:null;draw()};
document.getElementById("det").onclick=e=>{const a=e.target.closest("[data-go]"),x=e.target.closest("[data-tx]"),tb=e.target.closest("[data-tab]");
 if(tb){setView("tab");ensure(tb.dataset.tab);sel=tb.dataset.tab;draw()}
 else if(a){ensure(a.dataset.go);sel=a.dataset.go;draw()}
 else if(x){if(view==="tx"){ensure(x.dataset.tx);sel=x.dataset.tx;draw()}else{q=x.dataset.tx;document.getElementById("q").value=q;sel=null;build();draw()}}};
document.getElementById("dx").onclick=()=>{sel=null;draw()};
document.onkeydown=e=>{if(e.key==="Escape"){sel=null;draw()}};
document.getElementById("q").oninput=e=>{q=e.target.value;build();document.querySelector(".map").scrollTop=0;draw()};
document.getElementById("qx").onclick=()=>{q="";const i=document.getElementById("q");i.value="";build();document.querySelector(".map").scrollTop=0;draw();i.focus()};
document.querySelectorAll(".chip[data-v]").forEach(b=>b.onclick=()=>{setView(b.dataset.v);draw()});
document.querySelectorAll(".chip[data-s]").forEach(b=>b.onclick=()=>{setSys(b.dataset.s);draw()});

draw();
</script>
</body>
</html>
